<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soup Club · Amboss Rampe</title>
<style>
:root{color-scheme:light;--paper:#f3ede1;--ink:#27241e;--olive:#4f5d40;--rule:#838974;--frame:#e5dac7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 "Instrument Sans",Arial,sans-serif}
.page{width:min(100% - 3rem,74rem);margin:auto;padding:1.55rem 0 2.5rem}
.mast{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid var(--rule);padding-bottom:.7rem}
.mast p,.label,.when,.month h3,.price{margin:0;color:var(--olive);font-size:.81rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase}
.languages{display:flex;align-items:center;gap:.25rem}
button,.button{font:inherit;cursor:pointer;border:1px solid var(--olive);color:var(--olive);background:transparent;padding:.43rem .75rem;text-decoration:none;border-radius:0}
.languages button{border-color:transparent;line-height:1.2}
button[aria-pressed="true"],.primary{background:var(--olive);color:white}
:focus-visible{outline:2px solid #324d80;outline-offset:4px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,5.5rem);align-items:center;padding:clamp(1.7rem,4vw,3.5rem) 0}
h1,h2,.lead{font-family:"Baskervville",Georgia,serif;font-weight:400}
h1{margin:0;line-height:.91;letter-spacing:-.068em;font-size:clamp(4rem,8.7vw,9rem);overflow-wrap:anywhere}
.lead{font-size:clamp(1.25rem,2.15vw,2rem);line-height:1.25;margin:1.15rem 0 1.2rem}
.offer{margin:0 0 .32rem;font-size:1.04rem}
.price{letter-spacing:.035em;font-size:clamp(1.55rem,2.8vw,2.25rem);line-height:1.15;margin-top:.45rem}
.photo{margin:0;padding:.42rem;background:var(--frame)}
.photo img{width:100%;height:auto;aspect-ratio:579/434;display:block;object-fit:cover}
.details{display:grid;grid-template-columns:1.28fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.schedule,.venue{padding:1.15rem 0 1.35rem}
.venue{border-left:1px solid var(--rule);padding-left:clamp(1.2rem,4vw,3.7rem)}
.schedule{padding-right:clamp(1.2rem,4vw,3.7rem)}
h2{font-size:clamp(1.8rem,3.6vw,3.35rem);line-height:1.08;margin:.22rem 0 .45rem;letter-spacing:-.035em}
.months{display:flex;gap:1.15rem 2.35rem;flex-wrap:wrap;margin-top:.9rem}
.month h3{letter-spacing:.04em}
.month p{margin:.05rem 0 0;font-size:clamp(1rem,2vw,1.42rem);font-variant-numeric:tabular-nums;font-weight:700;word-spacing:.22em}
.address,.notes{margin:.5rem 0 0}.notes{font-size:.88rem;color:var(--olive)}
.menu{padding:1.4rem 0;border-bottom:1px solid var(--rule)}
.menu ul{padding-left:1.3rem;margin:.65rem 0 .25rem}
[hidden]{display:none!important}
.editor{width:min(100% - 2rem,74rem);margin:1rem auto;padding:1.25rem;border:1px solid var(--rule);background:#fffaf0}
.editor h2{font-size:2rem}
.editor p{margin:.4rem 0 1rem}
.editor form{display:grid;gap:1rem}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
fieldset{min-width:0;border:1px solid var(--rule);padding:.65rem .85rem .85rem}
legend{font-weight:700;color:var(--olive)}
.field{display:grid;gap:.2rem;margin:.55rem 0;font-size:.94rem}
input,textarea{width:100%;background:white;border:1px solid var(--rule);padding:.45rem .55rem;font:inherit;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:5rem;resize:vertical}
.actions{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center}
#status{margin:0}
@media(max-width:680px){
 .page{width:calc(100% - 2rem);padding-top:.8rem}
 .hero,.details,.fields{grid-template-columns:1fr}
 .hero{gap:1.25rem}
 h1{font-size:clamp(3.35rem,13vw,5.5rem)}
 .schedule{padding-right:0}
 .venue{border-left:0;border-top:1px solid var(--rule);padding-left:0}
}
</style>
</head>

<script>
"use strict";
const byId = (id) => document.getElementById(id);
const cleanPage = document.documentElement.cloneNode(true);
let content = JSON.parse(byId("content").textContent);
let language = "de";
let draftPhoto = content.photo;
let photoLoading = false;
let photoError = "";
const fields = {
  title: "Event name", lead: "Food description", offer: "Event format",
  price: "Flyer price", range: "Date range including year", days: "Day of week",
  time: "Start time", monthOne: "First month", datesOne: "First month’s dates",
  monthTwo: "Second month", datesTwo: "Second month’s dates",
  venue: "Venue", address: "Address", vegan: "Vegan options note",
  allergies: "Allergy note", photoAlt: "Photo description",
  menuTitle: "Weekly menu heading", menuItems: "Weekly menu entries (one per line)"
};
const labels = {de: {where: "Ort", language: "Sprache"}, en: {where: "Location", language: "Language"}};

function render() {
  const copy = content[language];
  document.documentElement.lang = language === "de" ? "de-CH" : "en";
  document.title = copy.title + " · " + copy.venue;
  for (const id of ["title", "lead", "offer", "price", "range", "days", "time", "venue", "address", "vegan", "allergies"]) {
    byId(id).textContent = copy[id];
  }
  byId("mast-venue").textContent = copy.venue;
  byId("where").textContent = labels[language].where;
  byId("languages").setAttribute("aria-label", labels[language].language);
  for (const button of document.querySelectorAll("[data-lang]")) {
    button.setAttribute("aria-pressed", String(button.dataset.lang === language));
  }
  byId("photo").src = content.photo;
  byId("photo").alt = copy.photoAlt;
  byId("months").replaceChildren();
  for (const [month, dates] of [[copy.monthOne, copy.datesOne], [copy.monthTwo, copy.datesTwo]]) {
    if (!month || !dates) continue;
    const cell = document.createElement("div");
    cell.className = "month";
    const title = document.createElement("h3");
    const numbers = document.createElement("p");
    title.textContent = month;
    numbers.textContent = dates;
    cell.append(title, numbers);
    byId("months").append(cell);
  }
  const entries = copy.menuItems.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
  byId("menu").hidden = !content.menuEnabled || !entries.length;
  byId("menu-title").textContent = copy.menuTitle;
  byId("menu-items").replaceChildren(...entries.map((entry) => {
    const item = document.createElement("li");
    item.textContent = entry;
    return item;
  }));
}

for (const button of document.querySelectorAll("[data-lang]")) {
  button.addEventListener("click", () => {
    language = button.dataset.lang;
    render();
  });
}

for (const [code, name] of [["de", "Deutsch"], ["en", "English"]]) {
  const group = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = name;
  group.append(legend);
  for (const [key, title] of Object.entries(fields)) {
    const label = document.createElement("label");
    label.className = "field";
    label.textContent = title;
    const input = document.createElement(key === "menuItems" ? "textarea" : "input");
    input.name = code + "." + key;
    input.value = content[code][key];
    input.required = ["title", "venue", "menuTitle"].includes(key);
    label.append(input);
    group.append(label);
  }
  byId("fields").append(group);
}
byId("menu-enabled").checked = content.menuEnabled;

byId("photo-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const messages = byId("status");
  const input = event.target;
  photoLoading = true;
  photoError = "";
  input.disabled = true;
  try {
    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type) || file.size > 5_000_000) {
      throw new Error("Choose a JPG, PNG or WebP image under 5 MB.");
    }
    const source = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("Could not read the image."));
      reader.readAsDataURL(file);
    });
    const image = new Image();
    image.src = source;
    await image.decode();
    draftPhoto = source;
    messages.textContent = "Photo ready. Apply or download to use it.";
  } catch (error) {
    photoError = error instanceof DOMException ? "Could not open this image." : error.message;
    messages.textContent = photoError + " Choose another file or submit again to keep the previous photo.";
    input.value = "";
  } finally {
    input.disabled = false;
    photoLoading = false;
  }
});

function downloadPage() {
  const snapshot = cleanPage.cloneNode(true);
  snapshot.querySelector("#content").textContent = JSON.stringify(content).replaceAll("<", "\\u003c");
  const file = new Blob(["<!doctype html>\n", snapshot.outerHTML], {type: "text/html;charset=utf-8"});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = "index.html";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30_000);
}

byId("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const status = byId("status");
  if (photoLoading) {
    status.textContent = "Wait for the photo to finish loading.";
    return;
  }
  if (photoError) {
    status.textContent = photoError + " Submit again to keep the previous photo.";
    photoError = "";
    return;
  }
  const form = new FormData(event.currentTarget);
  for (const code of ["de", "en"]) {
    for (const key of Object.keys(fields)) {
      content[code][key] = form.get(code + "." + key).trim();
    }
  }
  content.photo = draftPhoto;
  content.menuEnabled = byId("menu-enabled").checked;
  render();
  if (event.submitter?.id === "download") {
    downloadPage();
    status.textContent = "Download started. Open the downloaded HTML to check your saved version.";
  } else {
    status.textContent = "Preview updated. Download the HTML to keep these changes.";
  }
});

function showEditor() {
  byId("editor").hidden = location.hash !== "#edit";
}
window.addEventListener("hashchange", showEditor);
showEditor();
render();
</script>
</body>
</html>
